<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Capstone Product Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Explore Our Products</h1>
    <p>Filter and sort to find what suits you best</p>
  </header>

  <section class="controls">
    <select id="filterCategory" onchange="filterProducts()">
      <option value="all">All Categories</option>
      <option value="tech">Tech</option>
      <option value="books">Books</option>
    </select>

    <select id="sortOption" onchange="sortProducts()">
      <option value="name">Sort by Name</option>
      <option value="rating">Sort by Rating</option>
    </select>
  </section>

  <section id="productList" class="product-grid"></section>

  <script src="script.js"></script>
</body>
</html>
